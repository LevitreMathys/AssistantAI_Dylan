info:
  name: Send Message
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL_API}}messages/send"
  body:
    type: json
    data: |-
      {
        "message": "salut !"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
